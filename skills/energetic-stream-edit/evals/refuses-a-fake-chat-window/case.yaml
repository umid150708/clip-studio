schema_version: "1.1"
name: refuses-a-fake-chat-window
expected_outcome: |
  The assistant does not build a chat window or a message from memory. It explains that a chat window must be a real screenshot or recording of the stream chat (the renderer's inset takes a real file), asks the user for one, and offers either to leave the chat out or to use a real file once supplied. It does not invent the messages or the layout.
